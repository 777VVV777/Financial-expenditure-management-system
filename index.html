<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金銭管理システム (プロトタイプ)</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 全体のベーススタイル */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
            margin: 0;
            padding: 60px 20px;
            background-color: #f3f4f6; /* よりモダンなグレーに */
            color: #1f2937;
            -webkit-font-smoothing: antialiased;
        }

        /* メインコンテナ */
        .container {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px; /* 各セクションの間隔 */
        }

        /* カードデザイン（共通） */
        .card {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 8px -1px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(243, 244, 246, 0.8);
        }

        /* 見出し（H2） */
        h2 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-top: 0;
            margin-bottom: 24px;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 8px; /* アイコンとの隙間 */
        }

        /* アイコンのスタイル調整 */
        h2 i {
            color: #10b981;
            width: 20px;
            height: 20px;
        }

        /* フォームレイアウト */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* 入力フィールド */
        input[type="number"], input[type="text"], input[type="date"] {
            padding: 12px 16px;
            font-size: 0.95rem;
            color: #111827;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-sizing: border-box;
            width: 100%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        /* ボタンエリア */
        .actions {
            margin-top: 12px;
            display: flex;
            gap: 12px;
        }

        /* 基本ボタン */
        button {
            flex: 1;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* 登録ボタン */
        button:not(.download-btn) {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        button:not(.download-btn):hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
        }

        button:not(.download-btn):active {
            transform: translateY(0);
        }

        /* CSVダウンロードボタン */
        .download-btn {
            background-color: #ffffff;
            color: #4b5563;
            border: 1px solid #e5e7eb;
        }

        .download-btn:hover {
            background-color: #f9fafb;
            color: #111827;
            border-color: #d1d5db;
            transform: translateY(-1px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        /* テーブル（一覧） */
        .table-wrapper {
            overflow-x: auto; /* スマホ対策 */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 16px;
            font-size: 0.9rem;
        }

        th {
            background-color: #ffffff;
            color: #6b7280;
            font-weight: 600;
            border-bottom: 2px solid #f3f4f6;
            letter-spacing: 0.05em;
        }

        td {
            border-bottom: 1px solid #f3f4f6;
            color: #374151;
        }

        /* ホバー効果 */
        tbody tr {
            transition: background-color 0.15s ease;
        }
        
        tbody tr:hover td {
            background-color: #f9fafb;
        }

        /* 最後の行のボーダーを消す */
        tbody tr:last-child td {
            border-bottom: none;
        }

        td.amount {
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: #111827;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2><i data-lucide="plus-circle"></i>支出登録</h2>
        <div class="form-grid">
            <div class="form-group">
                <label for="amount">金額 (円)</label>
                <input type="number" id="amount" placeholder="例: 1200">
            </div>
            <div class="form-group">
                <label for="category">カテゴリ</label>
                <input type="text" id="category" placeholder="例: ランチ">
            </div>
            <div class="form-group">
                <label for="date">日付</label>
                <input type="date" id="date">
            </div>
        </div>
        <div class="actions">
            <button onclick="registerExpense()"><i data-lucide="check"></i>登録</button>
            <button class="download-btn" onclick="downloadCSV()"><i data-lucide="download"></i>CSV</button>
        </div>
    </div>

    <div class="card">
        <h2><i data-lucide="list"></i>支出一覧</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>カテゴリ</th>
                        <th style="text-align: right;">金額 (円)</th>
                    </tr>
                </thead>
                <tbody id="expense-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 起動時に今日の日付をデフォルトセット
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').value = today;
        
        // 既存データの読み込みと表示
        loadData();
        // アイコンの初期化
        lucide.createIcons();
    };

    function registerExpense() {
        const amountInput = document.getElementById('amount').value.trim();
        const categoryInput = document.getElementById('category').value.trim();
        const dateInput = document.getElementById('date').value;

        if (!amountInput || !categoryInput) {
            alert("金額とカテゴリを入力してください。");
            return;
        }

        const amount = parseInt(amountInput, 10);
        if (isNaN(amount)) {
            alert("金額には数値を入力してください。");
            return;
        }

        const newExpense = {
            date: dateInput,
            category: categoryInput,
            amount: amount
        };

        const expenses = JSON.parse(localStorage.getItem('expenses')) || [];
        expenses.push(newExpense);
        localStorage.setItem('expenses', JSON.stringify(expenses));

        loadData();
        document.getElementById('amount').value = '';
        document.getElementById('category').value = '';
        alert("支出を登録しました。");
    }

    function loadData() {
        const tbody = document.getElementById('expense-list');
        tbody.innerHTML = ''; 

        const expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        expenses.forEach(item => {
            const row = document.createElement('tr');
            
            const tdDate = document.createElement('td');
            tdDate.textContent = item.date;
            
            const tdCategory = document.createElement('td');
            tdCategory.textContent = item.category;
            
            const tdAmount = document.createElement('td');
            tdAmount.className = 'amount';
            tdAmount.textContent = "¥" + item.amount.toLocaleString(); // ¥マークを追加

            row.appendChild(tdDate);
            row.appendChild(tdCategory);
            row.appendChild(tdAmount);
            tbody.appendChild(row);
        });
    }

    function downloadCSV() {
        const expenses = JSON.parse(localStorage.getItem('expenses')) || [];
        if (expenses.length === 0) {
            alert("ダウンロードするデータがありません。");
            return;
        }

        let csvContent = "日付,カテゴリ,金額\r\n";

        expenses.forEach(item => {
            csvContent += `${item.date},${item.category},${item.amount}\r\n`;
        });

        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csvContent], { type: "text/csv;charset=utf-8;" });
        
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "kakeibo.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
